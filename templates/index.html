<!DOCTYPE html>
<html>
<head>
    <title>Cloud SaaS Project Management</title>
    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>Cloud-Based Project Management</h1>
    <p>Multi-Tenant SaaS Platform</p>

    <div class="dashboard">

        <div class="card">
            <h2>10</h2>
            <p>Total Projects</p>
        </div>

        <div class="card">
            <h2>25</h2>
            <p>Team Members</p>
        </div>

        <div class="card">
            <h2>15</h2>
            <p>Completed Tasks</p>
        </div>

    </div>

    <h2>Project Management Dashboard</h2>

    <button>Create New Project</button>

    <h3>Available Projects</h3>

    <ul>
        <li>Website Development</li>
        <li>Mobile Application</li>
        <li>Cloud Infrastructure</li>
    </ul>

</div>

</body>
</html>
